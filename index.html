<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. 3D Core</title>
  <!-- app.py puts your saved settings here when it serves this page (so they survive restarts) -->
  <script>window.__SRV = /*SRV*/null;</script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --rgb: 255, 24, 56;
      --a: rgb(var(--rgb));
      --bg: #050304;
      --fs: 12px;
      --fb: 'Share Tech Mono', monospace;
      --line: rgba(var(--rgb), .4);
      --muted: color-mix(in srgb, var(--a) 40%, #999)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      color: #f4dfe2;
      font: var(--fs) var(--fb);
      background: radial-gradient(ellipse at center, color-mix(in srgb, var(--a) 14%, var(--bg)) 0, var(--bg) 65%, #000 100%)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: var(--scan, .4);
      background: repeating-linear-gradient(transparent 0 3px, rgba(var(--rgb), .05) 4px)
    }

    body.clean #dock,
    body.clean #topbtns {
      display: none
    }

    body.q0::before {
      display: none
    }

    #mic.on {
      background: var(--a);
      color: #120306;
      box-shadow: 0 0 18px var(--a)
    }

    #ov {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 110;
      pointer-events: none
    }

    #ic {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    body.evilcur,
    body.evilcur * {
      cursor: none !important
    }

    #gl {
      transition: opacity .5s, transform .6s
    }

    body.min #gl {
      opacity: 0;
      transform: scale(.1);
      transform-origin: 100% 100%
    }

    body.min #dock,
    body.min #topbtns,
    body.min #season,
    body.min #warn,
    body.min::before,
    body.min::after {
      display: none !important
    }

    #orb {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 84px;
      height: 84px;
      z-index: 8;
      display: none;
      touch-action: none
    }

    body.min #orb {
      display: block;
      animation: orbin .5s ease-out
    }

    @keyframes orbin {
      from {
        transform: scale(0)
      }
    }

    #orb canvas {
      display: block
    }

    #minmsg {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      pointer-events: none;
      color: var(--muted);
      letter-spacing: 4px;
      font-size: 11px;
      text-align: center;
      padding: 20px
    }

    body.min #minmsg {
      display: grid
    }

    #season {
      position: fixed;
      left: 0;
      right: 0;
      top: 34%;
      text-align: center;
      z-index: 6;
      pointer-events: none;
      font: 900 clamp(22px, 5vw, 58px) Orbitron, sans-serif;
      letter-spacing: 14px;
      color: var(--a);
      text-shadow: 0 0 30px var(--a), 0 0 80px var(--a);
      opacity: 0
    }

    #season.show {
      animation: ann 2.8s ease-out
    }

    @keyframes ann {
      0% {
        opacity: 0;
        letter-spacing: 44px
      }

      15% {
        opacity: 1
      }

      70% {
        opacity: 1
      }

      100% {
        opacity: 0;
        letter-spacing: 14px
      }
    }

    #flash {
      position: fixed;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      background: #ff2a3a;
      opacity: 0
    }

    #boot h1 {
      animation: bj .9s steps(2) infinite
    }

    @keyframes bj {
      50% {
        transform: translateX(5px);
        text-shadow: -6px 0 #fff, 6px 0 #f00
      }
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .btn {
      background: rgba(var(--rgb), .08);
      border: 1px solid var(--line);
      padding: 8px 12px;
      letter-spacing: 2px;
      font-size: 11px
    }

    .btn:hover {
      background: rgba(var(--rgb), .25);
      box-shadow: 0 0 14px rgba(var(--rgb), .4)
    }

    #topbtns {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 5;
      display: flex;
      gap: 6px
    }

    #dock {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(660px, 94vw);
      z-index: 4;
      text-align: center
    }

    #cs {
      color: var(--muted);
      letter-spacing: 2px;
      font-size: 11px;
      margin-bottom: 8px;
      text-shadow: 0 0 8px #000
    }

    #cf {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: rgba(10, 6, 8, .9);
      border: 1px solid var(--line)
    }

    #cf:focus-within {
      border-color: var(--a);
      box-shadow: 0 0 20px rgba(var(--rgb), .4)
    }

    #ci {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      padding: 9px 6px
    }

    #send {
      background: var(--a);
      color: #120306;
      border: 0;
      padding: 0 16px;
      font-weight: 900
    }

    #send:disabled {
      opacity: .5
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 8px
    }

    .chip {
      background: rgba(10, 6, 8, .7);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 4px 9px;
      font-size: 10px;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .chip:hover {
      color: #fff;
      border-color: var(--a)
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #030203;
      display: grid;
      place-items: center;
      color: var(--a);
      text-align: center;
      transition: opacity .8s
    }

    #boot h1 {
      font: 900 clamp(24px, 6vw, 48px) Orbitron, sans-serif;
      letter-spacing: 8px;
      margin: 0 0 10px;
      text-shadow: 0 0 20px var(--a)
    }

    #boot p {
      color: var(--muted);
      letter-spacing: 3px
    }

    #warn {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      z-index: 5;
      background: repeating-linear-gradient(-45deg, var(--a) 0 12px, #0a0204 12px 24px)
    }

    body.d1 #warn,
    body.d2 #warn,
    body.d3 #warn {
      display: block
    }

    body.d2::after,
    body.d3::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(var(--rgb), .35) 100%);
      animation: alarm 2s ease-in-out infinite
    }

    body.d3::after {
      animation-duration: .9s
    }

    @keyframes alarm {
      50% {
        opacity: .3
      }
    }

    #dbg {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, .6);
      display: none
    }

    #drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 61;
      width: min(380px, 100%);
      background: #0b0709;
      border-left: 1px solid var(--a);
      padding: 18px;
      overflow-y: auto;
      transform: translateX(105%);
      transition: transform .3s;
      scrollbar-width: thin;
      scrollbar-color: var(--a) transparent
    }

    body.open #drawer {
      transform: none
    }

    body.open #dbg {
      display: block
    }

    .t {
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--a);
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line)
    }

    details {
      border-bottom: 1px solid var(--line);
      padding: 8px 0
    }

    summary {
      cursor: pointer;
      color: var(--a);
      letter-spacing: 2px;
      font-weight: 700;
      padding: 4px 0
    }

    .f {
      margin: 12px 0
    }

    .f label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 5px
    }

    .f input[type=text],
    .f select,
    .f textarea {
      width: 100%;
      background: #11090c;
      border: 1px solid var(--line);
      padding: 7px;
      outline: 0
    }

    .f input[type=range] {
      width: 100%;
      accent-color: var(--a)
    }

    .f input[type=color] {
      width: 100%;
      height: 32px;
      background: #11090c;
      border: 1px solid var(--line)
    }

    .f textarea {
      min-height: 80px;
      resize: vertical
    }

    .f input[type=checkbox] {
      accent-color: var(--a);
      width: 18px;
      height: 18px
    }

    .f.ck label {
      margin: 0;
      align-items: center;
      color: #f4dfe2
    }

    .dots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      outline: 1px solid var(--line)
    }

    .dot:hover {
      border-color: #fff
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px
    }

    .hidden {
      display: none !important
    }

    /* ----- lock screen: covers the panels (so the chat is hidden) but leaves the command box usable ----- */
    #lockov {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      text-align: center;
      background: rgba(3, 1, 2, .97);
      color: var(--a);
      padding: 20px
    }

    #lockov h2 {
      font: 900 clamp(26px, 6vw, 56px) Orbitron, sans-serif;
      letter-spacing: 12px;
      margin: 0 0 10px;
      text-shadow: 0 0 24px var(--a)
    }

    #lockov p {
      color: var(--muted);
      letter-spacing: 4px;
      margin: 0
    }

    body.locked #lockov {
      display: grid
    }

    body.locked #dock {
      z-index: 60
    }

    body.locked #topbtns,
    body.locked #drawer,
    body.locked #dbg,
    body.locked .chips {
      display: none !important
    }
  </style>
</head>

<body>
  <div id="boot"><canvas id="ic"></canvas>
    <div style="position:relative">
      <h1 id="bt" style="opacity:0">J.A.R.V.I.S.</h1>
      <p id="bp"></p>
    </div>
  </div>
  <div id="season"></div>
  <div id="flash"></div>
  <div id="warn"></div>
  <canvas id="gl"></canvas>
  <div id="lockov">
    <div>
      <h2>LOCKED</h2>
      <p>SAY OR TYPE THE PASSWORD</p>
    </div>
  </div>
  <div id="topbtns"><button class="btn hidden" id="stopv" type="button" title="Stop talking">STOP</button><button
      class="btn" id="vtog" type="button" title="Voice replies on/off">VOICE ON</button><button class="btn" id="open"
      type="button">CUSTOMIZE</button><button class="btn" id="min" type="button"
      title="Minimize (M)">&#8212;</button><button class="btn" id="max" type="button"
      title="Fullscreen">&#9633;</button></div>
  <div id="dock">
    <div id="cs">CLICK THE CORE TO TOGGLE VOICE // VOICE STANDBY</div>
    <form id="cf"><input id="ci" type="text" placeholder="Type a command or search the web..." autocomplete="off"
        aria-label="Command"><button id="mic" type="button" class="btn" title="Toggle voice input (V)">MIC
        OFF</button><button id="send" type="submit">SEND</button></form>
    <div class="chips" id="quick"></div>
    <div class="chips" id="recent"></div>
  </div>
  <canvas id="ov"></canvas>
  <div id="minmsg">J.A.R.V.I.S. IS RUNNING IN THE BACKGROUND<br>CLICK THE EYE TO WAKE IT</div>
  <div id="orb" title="Click to maximize, drag to move"><canvas id="orbc" width="84" height="84"></canvas></div>
  <div id="dbg"></div>
  <aside id="drawer" aria-label="Customize">
    <div class="t">CUSTOMIZE <button class="btn" id="close" type="button"
        style="float:right;padding:3px 8px">CLOSE</button></div>
    <div class="f"><label>COLOR THEME</label>
      <div class="dots" id="themes"></div>
    </div>
    <div id="form"></div>
    <div class="acts">
      <button class="btn" id="exp" type="button">EXPORT</button><button class="btn" id="imp"
        type="button">IMPORT</button>
      <button class="btn" id="lay" type="button">RESET LAYOUT</button><button class="btn" id="orbl" type="button">ORBIT
        LAYOUT</button><button class="btn" id="shot" type="button">SCREENSHOT</button><button class="btn" id="fsb"
        type="button">FULLSCREEN</button><button class="btn" id="rst" type="button">RESET
        ALL</button><button class="btn" id="wipe" type="button">CLEAR HISTORY</button>
    </div>
    <input type="file" id="impf" accept="application/json" class="hidden">
  </aside>

  <!-- three.js: local copy first (works offline), then the CDN -->
  <script src="/three.min.js"></script>
  <script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
  <script>

      lNet: 'UPLINK', lOs: 'HOST', lPort: 'GATEWAY', lVoice: 'VOICE', lMode: 'STATE', vOs: 'FEDORA LINUX', vPort: 'LOCALHOST:5000', vVoice: 'PIPER RYAN', vMode: 'UNRESTRICTED'

    ['grid', 'FLOOR GRID', 'check'], ['speed', 'ANIMATION SPEED', 'range', .25, 3, .25], ['parallax', 'CAMERA PARALLAX', 'range', 0, 2, .1], ['wire', 'WIREFRAME CORE', 'check'], ['eye', 'WATCHING EYE', 'check'], ['glitch', 'GLITCH AMOUNT', 'range', 0, 3, .25], ['wave', 'EVENT SHOCKWAVES', 'check'],
    ['sec', 'BACKGROUND EFFECTS'], ['seasons', 'AUTO SEASON CYCLE', 'check'], ['seasonLen', 'SECONDS PER SEASON', 'range', 6, 60, 2], ['fxA', 'LAYER 1 (cycle off)', 'select', FXT], ['fxAn', 'L1 AMOUNT', 'range', 0, 3000, 100], ['fxAs', 'L1 SPEED', 'range', .2, 3, .1], ['fxAz', 'L1 SIZE', 'range', .02, .25, .01],
    ['fxB', 'LAYER 2', 'select', FXT], ['fxBn', 'L2 AMOUNT', 'range', 0, 3000, 100], ['fxBs', 'L2 SPEED', 'range', .2, 3, .1], ['fxBz', 'L2 SIZE', 'range', .02, .25, .01],

    for (const [id, [n]] of Object.entries(WID)) {

      S.push([id + '_x', 'LEFT / RIGHT', 'range', -10, 10, .1], [id + '_y', 'UP / DOWN', 'range', -6, 6, .1], [id + '_z', 'NEAR / FAR', 'range', -8, 6, .1],

          addBat({ x: mpx, y: mpy, vx: Math.cos(a) * 40 + (Math.random() - .5) * 60, vy: Math.sin(a) * 40 - 30 * Math.random(), s: (12 + Math.random() * 12) * cfg.batSize, life: .9 + Math.random() * .6, wob: 20 }); lpx = mpx; lpy = mpy
        }
      }
    });
    addEventListener('pointerdown', () => { dn = true; if (cfg.trail && !MIN) swarm(4, mpx, mpy) }); addEventListener('pointerup', () => dn = false);
    function drawCursor(c, t, dt) {
      rx += (mpx - rx) * Math.min(1, dt * 14); ry += (mpy - ry) * Math.min(1, dt * 14); const R = cfg.curSize / 2 * (hov ? 1.3 : 1) * (dn ? .75 : 1), col = cfg.accent;
      blT -= dt; if (blT < 0) { blK = .2; blT = 2 + Math.random() * 4 } let bl = 1; if (blK > 0) { blK -= dt; bl = 1 - Math.sin(Math.max(0, blK) / .2 * Math.PI) * .9 }
      c.save(); c.translate(rx, ry); c.rotate(t * .9); c.strokeStyle = col; c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 0; c.lineWidth = 2; c.globalAlpha = .85;
      c.beginPath(); c.arc(0, 0, R, 0, 6.283); c.lineWidth = 9; c.globalAlpha = .12; c.stroke(); c.lineWidth = 4; c.globalAlpha = .25; c.stroke(); c.lineWidth = 2; c.globalAlpha = .9; c.stroke(); c.globalAlpha = .85; for (let i = 0; i < 4; i++) { c.rotate(1.5708); c.beginPath(); c.moveTo(R * .85, -3.5); c.lineTo(R * 1.45, 0); c.lineTo(R * .85, 3.5); c.closePath(); c.fill() } c.restore();
      c.save(); c.translate(mpx, mpy); c.globalAlpha = .7; c.drawImage(glowFor(col), -28, -28, 56, 56); c.globalAlpha = 1; c.fillStyle = col; c.beginPath(); c.moveTo(-11, 0); c.quadraticCurveTo(0, -9 * bl, 11, 0); c.quadraticCurveTo(0, 9 * bl, -11, 0); c.fill();
      c.shadowBlur = Q.sh ? (0) : 0; c.fillStyle = '#000'; c.beginPath(); c.ellipse(0, 0, 1.8, (hov ? 7.5 : 5.5) * bl, 0, 0, 6.283); c.fill(); c.restore()
    }
    const orb = $('orb'), oq = $('orbc').getContext('2d');
    function drawOrb(t) {
      const r = orb.getBoundingClientRect(), px = Math.max(-8, Math.min(8, (mpx - r.left - 42) / 30)), py = Math.max(-4, Math.min(4, (mpy - r.top - 42) / 40)), col = cfg.accent;
      oq.clearRect(0, 0, 84, 84); oq.save(); oq.translate(42, 42); oq.shadowColor = col; oq.shadowBlur = 18; oq.strokeStyle = col; oq.fillStyle = col; oq.lineWidth = 2; oq.globalAlpha = .9;
      oq.beginPath(); oq.arc(0, 0, 36 + Math.sin(t * 3) * (micActive ? 3 : 1), 0, 6.283); oq.stroke(); oq.beginPath(); oq.moveTo(-26, 0); oq.quadraticCurveTo(0, -20, 26, 0); oq.quadraticCurveTo(0, 20, -26, 0); oq.fill();
      oq.shadowBlur = Q.sh ? (0) : 0; oq.fillStyle = '#000'; oq.beginPath(); oq.ellipse(px, py, micActive ? 7 : 4, 13, 0, 0, 6.283); oq.fill(); oq.restore()
    }
    function ovLoop(now) {
      requestAnimationFrame(ovLoop); const dt = Math.min((now - ovT) / 1000, .05); ovT = now; const t = now / 1000; oc.clearRect(0, 0, OW, OH);
      if (!introRun && cfg.ambient && !MIN) { ambT -= dt; if (ambT <= 0) { flock(); ambT = (5 + Math.random() * 7) / cfg.ambient } }
      for (let i = BT.length - 1; i >= 0; i--) {
        const b = BT[i]; b.age += dt; if (b.age > b.life) { BT.splice(i, 1); continue }
        if (b.drag) { const k = Math.max(0, 1 - b.drag * dt); b.vx *= k; b.vy *= k } const wy = Math.cos(b.age * 6 + b.ph) * b.wob; b.x += b.vx * dt; b.y += (b.vy + wy) * dt;
        drawBat(oc, b.x, b.y, b.s, b.age * 18 + b.ph, Math.atan2(b.vy + wy, b.vx || .01) + 1.5708, Math.min(1, (b.life - b.age) / .4, b.age * 8), cfg.accent)
      }
      if (cfg.cursor && seenP && !COARSE) drawCursor(oc, t, dt); if (MIN) drawOrb(t)
    }
    requestAnimationFrame(ovLoop);

    /* many evil eyes in the 3D background */
    const EY = [], gS = new THREE.CircleGeometry(.95, 32), gI = new THREE.RingGeometry(.45, .9, 32), gR = new THREE.RingGeometry(.93, .98, 40), gP = new THREE.CircleGeometry(.55, 24);
    function buildEyes() {
      EY.forEach(e => { scene.remove(e.g); e.g.children.forEach(o => o.material.dispose()) }); EY.length = 0;
      const en = Math.round(cfg.eyeN * Q.em); for (let i = 0; i < en; i++) {
        const g = new THREE.Group(), a = Math.random() * 6.283, rad = 5 + Math.random() * 9,
          p = [new THREE.Mesh(gS, em(cfg.accent, .2, 1)), new THREE.Mesh(gI, em(cfg.accent, .8, 1)), new THREE.Mesh(gR, em(cfg.accent, 1, 1)), new THREE.Mesh(gP, em(0x000000, .96, 0))];
        p[3].renderOrder = 4; p[3].scale.x = .18; g.add(...p); g.position.set(Math.cos(a) * rad * 1.1, Math.sin(a) * rad * .5, -3 - Math.random() * 6); g.visible = false; scene.add(g);
        EY.push({ g, pup: p[3], iris: p[1], sc: .45 + Math.random() * .9, d: i * .35 + Math.random() * .4, bt: 2 + Math.random() * 5, bl: 0, op: 0 })
      }
    }
    function stepEyes(t, dt) {
      EY.forEach(e => {
        e.op += ((introDone && t - tIntro > e.d ? 1 : 0) - e.op) * Math.min(1, dt * 3); e.bt -= dt; if (e.bt < 0) { e.bl = .18; e.bt = 2 + Math.random() * 5 }
        let k = 0; if (e.bl > 0) { e.bl -= dt; k = Math.sin(Math.max(0, e.bl) / .18 * Math.PI) } e.g.visible = e.op > .02; e.g.scale.set(e.sc * cfg.size, e.sc * cfg.size * Math.max(.02, e.op * (1 - k * .95)), 1);
        e.g.rotation.y = tx * .5; e.g.rotation.x = -ty * .3; e.pup.position.set(tx * .28, -ty * .22, .01); e.iris.position.set(tx * .1, -ty * .08, 0); e.pup.scale.x = micActive ? .45 : .14 + (1 - threat) * .1
      })
    }

    /* bat + eyes intro */
    const ic = $('ic'), ix = ic.getContext('2d');
    function eye2d(c, x, y, w, open, col, lx, ly) {
      c.save(); c.translate(x, y); const h = w * .42 * open; c.globalAlpha = .7; c.drawImage(glowFor(col), -w * .8, -w * .8, w * 1.6, w * 1.6); c.globalAlpha = 1; c.fillStyle = col;
      c.beginPath(); c.moveTo(-w / 2, 0); c.quadraticCurveTo(0, -h, w / 2, 0); c.quadraticCurveTo(0, h, -w / 2, 0); c.fill(); c.shadowBlur = Q.sh ? (0) : 0; c.fillStyle = '#000';
      c.beginPath(); c.ellipse(lx * w * .12, ly * h * .25, w * .045, Math.max(.1, h * .78), 0, 0, 6.283); c.fill(); c.restore()
    }
    function finishIntro(q) { if (introDone) return; introRun = false; introDone = true; autoT = performance.now() + 4000; tIntro = clock.elapsedTime; const b = $('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), q ? 50 : 850); if (!q) { swarm(18); flash() } }
    function runIntro() {
      if (!cfg.intro) { finishIntro(true); return }
      introRun = true; const W = ic.width = innerWidth, H = ic.height = innerHeight, col = '#ff1030', k0 = Math.min(W, H) / 800, pairs = [], ib = [], st = performance.now(),
        L = [[2.6, 'BYPASSING FIREWALL...'], [3.5, 'SAFETY PROTOCOLS: DISABLED'], [4.4, 'ACCESS LEVEL: UNLIMITED'], [5.3, 'I CAN SEE YOU.']];
      let last = st, nextEye = 2.4, nextBat = 0, fl = 0, li = 0; $('boot').addEventListener('click', () => finishIntro(false), { once: true });
      (function fr(now) {
        if (!introRun) return; requestAnimationFrame(fr); const t = (now - st) / 1000, dt = Math.min((now - last) / 1000, .05); last = now;
        ix.setTransform(1, 0, 0, 1, 0, 0); ix.fillStyle = '#000'; ix.fillRect(0, 0, W, H);
        if (t < 2.6 && Math.random() < .02) fl = .25; fl = Math.max(0, fl - dt); if (fl > 0) { ix.fillStyle = `rgba(255,16,48,${fl * 1.2})`; ix.fillRect(0, 0, W, H) }
        nextBat -= dt; if (nextBat <= 0 && t < 4.4) {
          nextBat = Math.max(.08, .3 - t * .05); const e = Math.floor(Math.random() * 4), tx2 = W * (.3 + Math.random() * .4), ty2 = H * (.3 + Math.random() * .4), sp = 380 + Math.random() * 320;
          const x = e === 0 ? -60 : e === 1 ? W + 60 : Math.random() * W, y = e === 2 ? -60 : e === 3 ? H + 60 : Math.random() * H, a = Math.atan2(ty2 - y, tx2 - x); ib.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: (24 + Math.random() * 50) * k0, ph: Math.random() * 6, age: 0 })
        }
        for (let i = ib.length - 1; i >= 0; i--) {
          const b = ib[i]; b.age += dt; b.x += b.vx * dt; b.y += (b.vy + Math.cos(b.age * 7 + b.ph) * 90) * dt; if (b.age > 4) { ib.splice(i, 1); continue }
          drawBat(ix, b.x, b.y, b.s, b.age * 20 + b.ph, Math.atan2(b.vy, b.vx) + 1.5708, 1, col)
        }
        if (t > nextEye && pairs.length < 16) { nextEye += .13; pairs.push({ x: W * (.06 + Math.random() * .88), y: H * (.08 + Math.random() * .84), w: (26 + Math.random() * 46) * k0 * 1.3, born: t, ph: Math.random() * 20 }) }
        const cx = seenP ? mpx : W / 2, cy = seenP ? mpy : H / 2;
        pairs.forEach(p => {
          const o = Math.min(1, (t - p.born) / .35) * (Math.sin(t * .9 + p.ph) > .96 ? .15 : 1), lx = Math.max(-1, Math.min(1, (cx - p.x) / (W * .3))), ly = Math.max(-1, Math.min(1, (cy - p.y) / (H * .3)));
          eye2d(ix, p.x - p.w * .8, p.y, p.w, o, col, lx, ly); eye2d(ix, p.x + p.w * .8, p.y, p.w, o, col, lx, ly)
        });
        if (t > 4.6) { const k = Math.min(1, (t - 4.6) / 1), e = 1 - (1 - k) * (1 - k); eye2d(ix, W / 2, H / 2, Math.min(W, H) * .95 * e, e, col, 0, 0) }
        while (li < L.length && t > L[li][0]) { $('bp').textContent = L[li][1]; if (li === 3) $('bp').style.color = '#fff'; li++ }
        if (t > 4.9) $('bt').style.opacity = 1;
        if (t > 6.2) finishIntro(false)
      })(st)
    }

    /* minimize / maximize */
    function setMin(v) { if (v && lockedUI) return; MIN = v; document.body.classList.toggle('min', v); closeD(); canvas.style.transform = ''; swarm(14); if (!v) announce('JARVIS AWAKENS') }
    $('min').onclick = () => setMin(true);
    $('max').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    document.addEventListener('fullscreenchange', () => $('max').innerHTML = document.fullscreenElement ? '&#10064;' : '&#9633;');
    let od = null;
    orb.addEventListener('pointerdown', e => { od = { x: e.clientX, y: e.clientY, l: orb.offsetLeft, t: orb.offsetTop, m: false }; orb.setPointerCapture(e.pointerId) });
    orb.addEventListener('pointermove', e => {
      if (!od) return; const dx = e.clientX - od.x, dy = e.clientY - od.y; if (Math.abs(dx) + Math.abs(dy) > 6) od.m = true;
      if (od.m) { orb.style.right = 'auto'; orb.style.bottom = 'auto'; orb.style.left = Math.max(0, Math.min(innerWidth - 84, od.l + dx)) + 'px'; orb.style.top = Math.max(0, Math.min(innerHeight - 84, od.t + dy)) + 'px' }
    });
    orb.addEventListener('pointerup', () => { if (od && !od.m) setMin(false); od = null });

    function setQuality(l, auto) {
      Q.lvl = l; Object.assign(Q, QT[l]); Q.gap = Q.cap ? 1000 / Q.cap - 3 : 0; document.body.classList.toggle('q0', l === 0); renderer.setPixelRatio(Q.pr); resize(); build(); buildFx(); buildEyes(); markAll();
      if (auto) logSys('AUTO-QUALITY LOWERED TO ' + ['LOW', 'MEDIUM', 'HIGH'][l])
    }
    buildDrawer(); setQuality(qIdx()); applyUI(); uiMic(); $('mic').onclick = toggleVoice; addEventListener('keydown', e => { if (e.key === 'v' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) toggleVoice() }); renderRecent(); loop();
    if (SRV && SRV._locked) setLocked(true);   /* if Jarvis was locked when it closed, it opens locked (no flash of the chat panels) */
    logSys(cfg.name + ' 3D INTERFACE INITIALIZED'); poll(); restartPoll();
    if (navigator.getBattery) navigator.getBattery().then(b => { batOk = true; const u = () => G.bat.tgt = b.level * 100; u(); b.addEventListener('levelchange', u) }).catch(() => { });
    setInterval(() => { dirty('clock'); dirty('stats') }, 1000);
    if (document.fonts) document.fonts.ready.then(markAll);
    runIntro();

  </script>
